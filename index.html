<style>
@font-face{font-family:'Barlow';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:800;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}
/* Layout: app de uma coluna com barra de navegação fixa embaixo; cada tela rola por dentro. */
:root {
  --bg: #0d1114; --surface: #151b1f; --surface2: #1c2429; --line: #263037;
  --fg: #eef0ea; --mute: #8e9a9f; --dim: #5d6a70;
  --accent: #ff6b2c; --on-accent: #120a05; --ok: #3fc98a; --p: #ff5a36; --s: #ffb547;
  --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Barlow', system-ui, 'Segoe UI', Roboto, sans-serif;
  --r: 14px; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--body); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: inherit; }
#app { height: 100%; display: flex; flex-direction: column; }
main { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); box-shadow: 0 8px 12px -8px rgba(0,0,0,.6); padding: 14px 0 10px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; display: flex; align-items: center; gap: 10px; }
header.top h1 { margin: 0; font: 800 30px/1 var(--display); letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
header.top .sub { font: 600 12px/1 var(--display); color: var(--mute); letter-spacing: .14em; text-transform: uppercase; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

nav.tabs { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px)); }
nav.tabs a { text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; min-height: 48px; border-radius: 10px; color: var(--mute); font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; }
nav.tabs a[aria-current="page"] { color: var(--accent); }

.eyebrow { font: 700 12px/1.2 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
h2 { margin: 0; font: 800 22px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.muted { color: var(--mute); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 40px; font: 600 15px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.loc { display: inline-flex; gap: 3px; }
.loc b { font: 700 11px/1 var(--display); width: 18px; height: 18px; display: grid; place-items: center; border-radius: 5px; background: var(--surface2); color: var(--mute); letter-spacing: 0; }
.loc b.on { color: var(--fg); background: #2c383f; }

.meter { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
.summary { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.big { font: 800 44px/0.9 var(--display); font-variant-numeric: tabular-nums; }
.big small { font-size: 20px; color: var(--mute); }

.next { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scroll-snap-type: x mandatory; }
.next a { scroll-snap-align: start; flex: none; width: 168px; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.next canvas { width: 100%; height: 110px; background: var(--surface2); border-radius: 10px; }
.next strong { font: 700 18px/1.05 var(--display); text-transform: uppercase; }
.next span { font-size: 13px; color: var(--accent); font-weight: 600; }

section.trilha { display: flex; flex-direction: column; gap: 4px; }
.trilha-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 8px 0 6px; border-bottom: 1px solid var(--line); }
.trilha-h span { font: 600 14px/1 var(--display); color: var(--mute); font-variant-numeric: tabular-nums; }
.node { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; text-decoration: none; padding: 10px 4px; min-height: 56px; position: relative; border-radius: 10px; }
.node:active { background: var(--surface); }
.node .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--dim); background: var(--bg); position: relative; z-index: 1; }
.node .dot svg { width: 15px; height: 15px; }
.node::before { content: ""; position: absolute; left: 17px; top: -6px; bottom: -6px; width: 2px; background: var(--line); }
.node:first-of-type::before { top: 50%; } .node:last-child::before { bottom: 50%; }
.node[data-s="feito"] .dot { background: var(--ok); border-color: var(--ok); color: #06180f; }
.node[data-s="aberto"] .dot { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,107,44,.15); }
.node[data-s="bloqueado"] { color: var(--mute); }
.node[data-s="bloqueado"] .dot { color: var(--dim); }
.node .nm { font: 700 19px/1.1 var(--display); text-transform: uppercase; letter-spacing: .01em; }
.node .meta { font-size: 13px; color: var(--mute); line-height: 1.3; margin-top: 2px; }
.node[data-s="aberto"] .meta b { color: var(--accent); font-weight: 600; }
.node[data-hide] { display: none; }

/* detalhe */
.stage { position: relative; background: radial-gradient(ellipse at 50% 40%, #182026, #0f1418 70%); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stage canvas { display: block; width: 100%; height: min(58vh, 380px); }
.stage .ctrl { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 8px; align-items: center; }
.stage .ctrl button { min-width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: rgba(13,17,20,.8); padding: 0 12px; display: grid; place-items: center; font: 700 14px/1 var(--display); letter-spacing: .08em; }
.stage .ctrl button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.arrow-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--mute); margin-top: -10px; }
.arrow-legend span { display: inline-flex; align-items: center; gap: 6px; }
.arrow-legend i { width: 18px; height: 6px; border-radius: 3px; display: inline-block; }
.arrow-legend i.f { background: #ff7a3a; } .arrow-legend i.m { background: #4fd8e8; }
.arrow-legend i.t { background: repeating-linear-gradient(90deg, #ff6b2c 0 4px, transparent 4px 8px); }
.stage .tag { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
.pill { font: 700 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; background: var(--surface2); color: var(--mute); }
.pill.feito { background: var(--ok); color: #06180f; } .pill.aberto { background: var(--accent); color: var(--on-accent); }
ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; counter-reset: s; }
ol.steps li { counter-increment: s; }
ol.steps button { width: 100%; text-align: left; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; border: 1px solid transparent; background: var(--surface); border-radius: 12px; padding: 12px; line-height: 1.4; transition: border-color .2s, background .2s; }
ol.steps button::before { content: counter(s); font: 800 20px/1 var(--display); color: var(--mute); padding-top: 1px; }
ol.steps button[aria-current="step"] { border-color: var(--accent); background: #22191a; }
ol.steps button[aria-current="step"]::before { color: var(--accent); }
.maps { display: grid; grid-template-columns: 1fr 1fr minmax(0, 1.3fr); gap: 8px; align-items: center; }
.maps figure { margin: 0; text-align: center; }
.maps figcaption { font: 600 11px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-top: 4px; }
.body-map { width: 100%; height: auto; max-height: 220px; }
.legend { display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.35; min-width: 0; }
.legend .k { display: flex; align-items: center; gap: 6px; font: 700 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin-bottom: 3px; }
.legend .k i { width: 10px; height: 10px; border-radius: 3px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.rx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rx div { background: var(--surface2); border-radius: 10px; padding: 10px; }
.rx small { display: block; font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin-bottom: 4px; }
.rx b { font: 700 18px/1.1 var(--display); }
.row { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.row > * { min-width: 0; }
input.num { flex: 1 1 120px; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 700 22px/1 var(--display); padding: 0 14px; font-variant-numeric: tabular-nums; }
.btn { min-height: 48px; border-radius: 12px; border: 0; background: var(--accent); color: var(--on-accent); font: 800 18px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 0 18px; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.ok { background: var(--ok); color: #06180f; }
.btn.block { width: 100%; }
.linkbtn { background: none; border: 0; padding: 8px 0; color: var(--mute); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; min-height: 44px; }
.hist { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--mute); font-variant-numeric: tabular-nums; }
.hist .y { color: var(--ok); } .hist .n { color: var(--p); }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links a { font-size: 14px; padding: 6px 10px; border-radius: 8px; background: var(--surface2); text-decoration: none; }
.links a[data-s="feito"] { color: var(--ok); }
.fonte { font-size: 13px; color: var(--mute); border-left: 3px solid var(--line); padding-left: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; z-index: 50; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.5); }
.unlock { position: fixed; inset: 0; z-index: 60; background: rgba(6,9,11,.86); display: grid; place-items: center; padding: 24px; }
.unlock .box { text-align: center; display: flex; flex-direction: column; gap: 12px; max-width: 340px; }
.unlock .box .big { color: var(--ok); font-size: 56px; }

/* treino */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 12px; padding: 3px; background: var(--surface); gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; min-height: 44px; font: 700 17px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.plan { display: flex; flex-direction: column; gap: 14px; }
.plan h3 { margin: 0 0 6px; font: 700 13px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.plan a { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; text-decoration: none; padding: 10px 12px; border-radius: 12px; background: var(--surface); margin-bottom: 6px; min-height: 52px; }
.plan a b { font: 700 18px/1.1 var(--display); text-transform: uppercase; }
.plan a span { font-size: 14px; color: var(--mute); text-align: right; font-variant-numeric: tabular-nums; }
.player { display: flex; flex-direction: column; gap: 14px; }
.player .bigtime { font: 800 min(26vw, 120px)/0.9 var(--display); text-align: center; font-variant-numeric: tabular-nums; }
.player .bigtime.rest { color: var(--s); }
.player .what { text-align: center; }
.player .what b { display: block; font: 800 28px/1.05 var(--display); text-transform: uppercase; }
.player .stage canvas { height: min(38vh, 280px); }
.dots { display: flex; gap: 4px; justify-content: center; }
.dots i { width: 22px; height: 6px; border-radius: 3px; background: var(--surface2); }
.dots i.on { background: var(--accent); } .dots i.done { background: var(--ok); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
